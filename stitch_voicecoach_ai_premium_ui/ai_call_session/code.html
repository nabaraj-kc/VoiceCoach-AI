<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>VoiceCoach AI - Live Call</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        /* Base Pulse Animation for AI Visualizer */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(77, 163, 255, 0.4); opacity: 0.8; }
            50% { transform: scale(1.1); box-shadow: 0 0 0 40px rgba(77, 163, 255, 0); opacity: 0.4; }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(77, 163, 255, 0); opacity: 0.8; }
        }
        @keyframes pulse-core {
            0% { transform: scale(0.95); background-color: rgba(77, 163, 255, 0.8); }
            50% { transform: scale(1.05); background-color: rgba(77, 163, 255, 1); }
            100% { transform: scale(0.95); background-color: rgba(77, 163, 255, 0.8); }
        }
        @keyframes waveform {
            0%, 100% { height: 8px; }
            50% { height: 24px; }
        }
        .ai-pulse-ring {
            animation: pulse-ring 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .ai-pulse-core {
            animation: pulse-core 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .waveform-bar {
            animation: waveform 1s ease-in-out infinite;
            transform-origin: bottom;
        }
        .waveform-bar:nth-child(2) { animation-delay: 0.2s; }
        .waveform-bar:nth-child(3) { animation-delay: 0.4s; }
        .waveform-bar:nth-child(4) { animation-delay: 0.1s; }
        .waveform-bar:nth-child(5) { animation-delay: 0.5s; }
        .waveform-bar:nth-child(6) { animation-delay: 0.3s; }
        .waveform-bar:nth-child(7) { animation-delay: 0.6s; }

        /* Floating Animation for Prompts */
        @keyframes float-up {
            0% { opacity: 0; transform: translateY(20px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }
        .floating-prompt {
            animation: float-up 6s ease-in-out infinite;
        }
    </style>

                      "on-background": "#dde2f6",
                      "inverse-primary": "#0060a9",
                      "tertiary": "#ffb95c",
                      "on-error-container": "#ffdad6",
                      "secondary-fixed-dim": "#c6bfff",
                      "primary": "#a2c9ff",
                      "surface-tint": "#a2c9ff",
                      "secondary-container": "#4029ba",

                      "inverse-on-surface": "#2a303f",
                      "tertiary-fixed": "#ffddb7",

                      "surface": "#0d1321",
                      "primary-fixed-dim": "#a2c9ff",

                      "on-surface": "#dde2f6",
                      "on-tertiary-container": "#4f3000",
                      "primary-fixed": "#d3e4ff",
                      "outline-variant": "#404752",
                      "on-secondary": "#2900a0",
                      "primary-container": "#4da3ff",
                      "on-secondary-fixed-variant": "#4029ba",
                      "surface-bright": "#333948",

                      "error": "#ffb4ab",

                      "secondary": "#c6bfff",

<body class="bg-[#0B0F1A] text-on-background min-h-screen flex flex-col font-body-md overflow-hidden">
<!-- Top App Bar (Custom for Call Screen) -->
<header class="flex justify-between items-center w-full px-container-padding py-stack-md fixed top-0 left-0 z-40 bg-gradient-to-b from-[#0B0F1A] to-transparent">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-error animate-pulse"></div>
<span class="font-label-md text-label-md text-on-surface">14:02</span>
</div>
<button class="bg-error/10 hover:bg-error/20 border border-error/20 text-error px-4 py-2 rounded-full flex items-center gap-2 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">call_end</span>
<span class="font-label-md text-label-md">End Call</span>
</button>
</header>
<!-- Main Call Canvas -->
<main class="flex-1 flex flex-col items-center justify-center relative px-container-padding">
<!-- Subtle Ambient Background Glow -->
<div class="absolute inset-0 flex items-center justify-center opacity-20 pointer-events-none">
<div class="w-[500px] h-[500px] bg-primary-container rounded-full blur-[120px]"></div>
</div>
<!-- AI Visualization -->
<div class="relative w-64 h-64 flex items-center justify-center mb-stack-lg z-10">
<!-- Pulsing Rings -->
<div class="absolute inset-0 rounded-full border border-primary-container/30 ai-pulse-ring"></div>
<div class="absolute inset-4 rounded-full border border-primary-container/50 ai-pulse-ring" style="animation-delay: 0.5s;"></div>
<!-- Central Core -->
<div class="w-32 h-32 rounded-full bg-primary-container blur-sm absolute ai-pulse-core opacity-50"></div>
<div class="w-28 h-28 rounded-full bg-gradient-to-br from-primary-fixed to-primary-container shadow-[0_0_40px_rgba(77,163,255,0.4)] ai-pulse-core relative z-20 flex items-center justify-center">
<span class="material-symbols-outlined text-surface-container-lowest text-4xl" style="font-variation-settings: 'FILL' 1;">graphic_eq</span>
</div>
</div>
<!-- Live Coaching Prompt (Floating) -->
<div class="absolute top-[60%] w-full max-w-sm px-container-padding z-20 floating-prompt">
<div class="bg-surface-container-low/70 backdrop-blur-xl border border-white/10 rounded-xl p-4 flex items-start gap-3 shadow-[0_8px_32px_rgba(0,0,0,0.4)]">
<div class="bg-secondary-container/30 p-2 rounded-lg text-secondary-fixed">
<span class="material-symbols-outlined text-sm">speed</span>
</div>
<div>
<h4 class="font-label-md text-label-md text-on-surface mb-1">Pacing Suggestion</h4>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">You're speaking a bit fast. Try pausing for a second after your next key point.</p>
</div>
</div>
</div>
</main>
<!-- Bottom Controls & User Waveform -->
<footer class="fixed bottom-0 left-0 w-full z-50 pb-safe pt-stack-md bg-gradient-to-t from-[#0B0F1A] via-[#0B0F1A]/90 to-transparent">
<div class="px-container-padding pb-stack-md flex flex-col items-center gap-stack-md">
<!-- User Voice Visualizer (Small) -->
<div class="flex items-end justify-center gap-1 h-8 opacity-70">
<div class="w-1 bg-on-surface-variant rounded-full waveform-bar h-2"></div>
<div class="w-1 bg-on-surface-variant rounded-full waveform-bar h-4"></div>
<div class="w-1 bg-on-surface-variant rounded-full waveform-bar h-6"></div>
<div class="w-1 bg-primary-container rounded-full waveform-bar h-8"></div>
<div class="w-1 bg-primary-container rounded-full waveform-bar h-5"></div>
<div class="w-1 bg-on-surface-variant rounded-full waveform-bar h-3"></div>
<div class="w-1 bg-on-surface-variant rounded-full waveform-bar h-2"></div>
</div>
<!-- Call Controls -->
<div class="flex items-center justify-center gap-gutter">
<!-- Mute -->
<button class="w-14 h-14 rounded-full bg-surface-container-high/80 backdrop-blur-xl border border-white/5 flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
<!-- Video (Disabled State Example) -->
<button class="w-14 h-14 rounded-full bg-surface-container-lowest/50 backdrop-blur-xl border border-white/5 flex items-center justify-center text-on-surface-variant opacity-50 cursor-not-allowed">
<span class="material-symbols-outlined">videocam_off</span>
</button>
<!-- Speaker -->
<button class="w-14 h-14 rounded-full bg-surface-container-high/80 backdrop-blur-xl border border-white/5 flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
</div>
</div>
</footer>
<!-- Note: Suppressed Navigation Shells (TopAppBar & BottomNavBar) as this is a focused, transactional screen (Live Call) -->
</body></html>
