<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>VoiceCoach AI - Recording Screen</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

                      "surface-variant": "#2f3544",
                      "on-background": "#dde2f6",
                      "surface-container": "#191f2e",
                      "surface-tint": "#a2c9ff",
                      "surface-container-highest": "#2f3544",
                      "surface-container-low": "#151b29",
                      "on-primary": "#00315b",
                      "error": "#ffb4ab",
                      "on-tertiary-container": "#4f3000",
                      "outline-variant": "#404752",
                      "on-tertiary-fixed": "#2a1700",
                      "on-error": "#690005",
                      "secondary-container": "#4029ba",
                      "surface-dim": "#0d1321",
                      "surface": "#0d1321",
                      "surface-container-lowest": "#080e1c",
                      "outline": "#8a919d",
                      "on-primary-container": "#003866",
                      "on-secondary": "#2900a0",
                      "primary-container": "#4da3ff",
                      "on-primary-fixed": "#001c38",
                      "inverse-on-surface": "#2a303f",

                      "secondary-fixed": "#e4dfff",

                      "on-tertiary": "#462a00",
                      "inverse-surface": "#dde2f6",

                      "on-surface": "#dde2f6",

                      "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]

<style>
        /* Base Styles & Utility classes that need custom CSS */
        body {
            background-color: #0B0F1A;
            color: #dde2f6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .glass-panel {
            background: rgba(18, 24, 38, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ambient-glow {
            box-shadow: 0 0 40px rgba(108, 92, 231, 0.15);
        }

        /* Waveform Animation */
        .waveform-bar {
            width: 3px;
            background-color: #6C5CE7;
            border-radius: 9999px;
            margin: 0 2px;
            animation: pulse 1.2s infinite ease-in-out alternate;
        }

        @keyframes pulse {
            0% { height: 10%; opacity: 0.5; }
            100% { height: 100%; opacity: 1; }
        }

        /* Pulse Rings */
        .pulse-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(108, 92, 231, 0.4);
            animation: radarPulse 2s linear infinite;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes radarPulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="h-screen w-screen overflow-hidden flex flex-col relative">
<!-- Top Navigation (Contextual departure, back button) -->
<header class="w-full px-container-padding py-stack-md flex justify-between items-center z-40">
<button aria-label="Close Recording" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-on-surface" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<div class="text-center flex flex-col items-center">
<span class="font-label-sm text-label-sm text-outline tracking-widest uppercase">Session Length</span>
<div class="font-headline-md text-headline-md text-on-surface tracking-tight" id="timerDisplay">03:14</div>
</div>
<button aria-label="Settings" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-on-surface" style="font-variation-settings: 'FILL' 0;">tune</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center relative px-container-padding pb-stack-lg z-10">
<!-- Live Waveform Visualization -->
<div class="h-32 w-full max-w-md flex items-end justify-center mb-stack-lg relative z-20" id="waveformContainer">
<!-- Bars generated via JS for randomness -->
</div>
<!-- Real-time Metrics Bento Grid -->
<div class="w-full max-w-sm grid grid-cols-2 gap-base mb-stack-lg">
<!-- WPM Meter -->
<div class="glass-panel rounded-xl p-stack-sm flex flex-col items-start justify-between h-24">
<div class="flex items-center gap-2 w-full justify-between">
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">Pace</span>
<span class="material-symbols-outlined text-primary text-[16px]" style="font-variation-settings: 'FILL' 0;">speed</span>
</div>
<div class="flex items-baseline gap-1">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">142</span>
<span class="font-label-sm text-label-sm text-outline">WPM</span>
</div>
</div>
<!-- Filler Words -->
<div class="glass-panel rounded-xl p-stack-sm flex flex-col items-start justify-between h-24">
<div class="flex items-center gap-2 w-full justify-between">
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">Filler</span>
<span class="material-symbols-outlined text-error text-[16px]" style="font-variation-settings: 'FILL' 0;">error</span>
</div>
<div class="flex items-baseline gap-1">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">4</span>
<span class="font-label-sm text-label-sm text-outline">words</span>
</div>
</div>
</div>
<!-- Speaking Pace Indicator (Minimal) -->
<div class="w-full max-w-sm glass-panel rounded-full p-1 mb-stack-lg flex items-center justify-between relative">
<div class="absolute inset-0 flex justify-between px-4 items-center w-full pointer-events-none opacity-30">
<div class="w-px h-2 bg-white"></div>
<div class="w-px h-3 bg-white"></div>
<div class="w-px h-2 bg-white"></div>
</div>
<div class="flex-1 text-center font-label-sm text-label-sm py-2 text-outline">Slow</div>
<div class="flex-1 text-center font-label-sm text-label-sm py-2 text-surface-bright bg-accent-purple rounded-full shadow-[0_0_15px_rgba(108,92,231,0.5)]">Ideal</div>
<div class="flex-1 text-center font-label-sm text-label-sm py-2 text-outline">Fast</div>
</div>
</main>
<!-- Central Recording Button Area (Fixed to bottom, above safe area) -->
<div class="w-full flex justify-center pb-12 z-30 relative">
<button class="relative w-20 h-20 rounded-full bg-accent-purple flex items-center justify-center ambient-glow hover:scale-105 transition-transform duration-200 focus:outline-none focus:ring-4 focus:ring-accent-purple/50" id="recordBtn">
<!-- Pulsing background rings for visual feedback -->
<div class="pulse-ring w-full h-full" style="animation-delay: 0s;"></div>
<div class="pulse-ring w-full h-full" style="animation-delay: 1s;"></div>
<!-- Stop Icon (Square) since it's actively recording -->
<div class="w-6 h-6 bg-surface-bright rounded-[4px]"></div>
</button>
</div>
<script>
        // Generate random waveform bars
        const waveformContainer = document.getElementById('waveformContainer');
        const numBars = 45; // Adjust for density
        
        for (let i = 0; i < numBars; i++) {
            const bar = document.createElement('div');
            bar.className = 'waveform-bar';
            
            // Randomize height and animation delay to create a chaotic, natural look
            const randomHeight = Math.random() * 80 + 20; // 20% to 100% height
            const randomDelay = Math.random() * -1.5; // Negative delay to start immediately at different points
            const randomDuration = Math.random() * 0.5 + 0.8; // 0.8s to 1.3s
            
            bar.style.height = `${randomHeight}%`;
            bar.style.animationDelay = `${randomDelay}s`;
            bar.style.animationDuration = `${randomDuration}s`;
            
            // Taper the edges to make it look like a central sound source
            let opacity = 1;
            if (i < 10) opacity = i / 10;
            if (i > numBars - 10) opacity = (numBars - i) / 10;
            bar.style.opacity = opacity * 0.8; // Max base opacity

            waveformContainer.appendChild(bar);
        }

        // Simple Timer Logic
        let seconds = 194; // Starting at 3:14
        const timerDisplay = document.getElementById('timerDisplay');
        
        setInterval(() => {
            seconds++;
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }, 1000);

        // Record Button Interaction
        const recordBtn = document.getElementById('recordBtn');
        let isRecording = true;
        
        recordBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            const innerShape = recordBtn.querySelector('div:last-child');
            const pulses = recordBtn.querySelectorAll('.pulse-ring');
            
            if (isRecording) {
                // Change to Stop square
                innerShape.className = 'w-6 h-6 bg-surface-bright rounded-[4px] transition-all duration-300';
                recordBtn.classList.add('ambient-glow');
                pulses.forEach(p => p.style.display = 'block');
                // Restart waveform
                document.querySelectorAll('.waveform-bar').forEach(bar => bar.style.animationPlayState = 'running');
            } else {
                // Change to Record circle/mic
                innerShape.className = 'w-6 h-6 bg-surface-bright rounded-full transition-all duration-300';
                recordBtn.classList.remove('ambient-glow');
                pulses.forEach(p => p.style.display = 'none');
                // Pause waveform
                document.querySelectorAll('.waveform-bar').forEach(bar => {
                    bar.style.animationPlayState = 'paused';
                    bar.style.height = '10%'; // Flatten
                });
            }
        });
    </script>
</body></html>
